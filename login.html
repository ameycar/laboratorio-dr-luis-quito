<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Administrador</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
width:320px;
}

h2{
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#c62828;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#8e0000;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Admin Login</h2>

<input type="email" id="email" placeholder="Correo administrador">

<input type="password" id="password" placeholder="Contraseña">

<button onclick="login()">Ingresar</button>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
